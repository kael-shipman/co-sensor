# Shared by every device: identity, connectivity, clock.
# Requires substitutions: name.
#
# The device is self-contained: it reads the sensor and drives its display without
# any network. Wi-Fi only enables OTA updates, a clock (SNTP) and optional integrations
# (firmware/integrations/), so nothing here may reboot the device for being offline.
#
# The image ships with NO credentials, so the same binary can go to anyone. An
# unprovisioned unit opens a provisioning window at every boot: its own hotspot and
# setup page for Wi-Fi, and (with the Home Assistant package) an API that Home
# Assistant gives a unique key on adoption. See docs/onboarding.md.
substitutions:
  friendly_name: CO Sensor
  # Relative to the top-level config file; tests/firmware overrides it.
  components_dir: components

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Every unit runs the same image and appends the last 6 hex digits of its MAC at
  # boot (co-sensor-3fa2c1, "CO Sensor 3fa2c1"), so units never collide on a network
  # or in Home Assistant, and keep their identity across reflashes.
  name_add_mac_suffix: true
  project:
    name: kael-shipman.co-sensor
    version: "0.1.0"

logger:
  level: DEBUG

# Closes the hotspot/setup page and refuses unprovisioned API connections if the unit
# isn't set up within this long after boot; a power cycle reopens it. The unit keeps
# measuring and displaying either way.
provisioning:
  timeout: 15min

# No password: a shared image can't hold a secret. Owners who want one adopt the
# firmware and extend this entry (see docs/onboarding.md), hence the id.
ota:
  - platform: esphome
    id: ota_esphome

wifi:
  # ESPHome reboots after 15 min without Wi-Fi by default; a standalone sensor must not.
  reboot_timeout: 0s
  # Open hotspot named after the unit (co-sensor-xxxxxx), only while provisioning.
  ap: {}

# The hotspot's setup page, for choosing a Wi-Fi network from a phone.
captive_portal:

# Wi-Fi setup over USB from a browser (e.g. web.esphome.io), for when the window has
# closed or there's no phone handy.
improv_serial:

# Used by the display to show when it last refreshed. Point `servers:` at a local
# NTP server if the device's network has no internet access.
time:
  - platform: sntp
    id: sntp_time
    # Without this, ESPHome bakes in the timezone of the machine that built the image.
    # Home Assistant replaces it with its own at runtime (integrations/home-assistant.yaml).
    timezone: UTC
