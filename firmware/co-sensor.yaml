# The CO sensor product: one firmware image for every unit. Each unit names itself
# at boot by appending its MAC suffix (see common/base.yaml), e.g. co-sensor-3fa2c1.
# Device files only pick a name and compose packages; all behaviour lives in
# common/, boards/, modules/ and integrations/.
substitutions:
  name: co-sensor
  friendly_name: CO Sensor

packages:
  base: !include common/base.yaml
  board: !include boards/xiao-esp32c6.yaml
  co: !include modules/ze15.yaml
  co_lifecycle: !include modules/co-lifecycle.yaml
  # Every unit has an ePaper Driver Board + panel. Without a panel attached the driver
  # times out waiting on BUSY at each refresh (harmless, but logs warnings).
  display: !include modules/epd-1in54.yaml

  # Optional consumers of the sensor's readings. Remove for a standalone device.
  home_assistant: !include integrations/home-assistant.yaml
